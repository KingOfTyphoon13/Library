services:
  sql:
    image: mcr.microsoft.com/mssql/server:2025-latest
    restart: unless-stopped
    ports:
      - "${DB_PORT}:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "${DB_USER}", "-P", "${DB_PASSWORD}", "-Q", "SELECT 1", "-C"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  library:
    image: ${DOCKER_REGISTRY-}library
    restart: unless-stopped
    build:
      context: .
      dockerfile: Library/Dockerfile
    ports:
      - "${APP_PORT}:8080"
      - "${APP_HTTPS_PORT:-5001}:8081"
    environment:
      - ConnectionStrings__DBConnection=Server=sql;Database=${DB_NAME};User ID=${DB_USER};Password=${DB_PASSWORD};Pooling=True;MultipleActiveResultSets=True;Encrypt=True;TrustServerCertificate=True;Command Timeout=30;
      - Redis__Host=${REDIS_HOST}
      - Redis__Port=${REDIS_PORT}
      - Redis__Password=${REDIS_PASSWORD}
      - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT}
      - ENABLE_HTTPS=${ENABLE_HTTPS:-false}
      - CERT_NAME=${CERT_NAME:-cert}
      - CERT_PASSWORD=${CERT_PASSWORD:-}
    volumes:
      - ${CERT_PATH:-./.certs-empty}:/https:ro
    depends_on:
      sql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  sql-data:
  redis-data: